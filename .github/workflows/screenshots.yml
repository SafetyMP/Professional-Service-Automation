name: Screenshots

on:
  release:
    types: [published]
  schedule:
    # First of each month — catch UI drift
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://psa_app:psa_app_dev@localhost:5432/psa?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/psa?schema=public
      AUTH_SECRET: ci-screenshot-secret-min-32-chars!!
      AUTH_URL: http://localhost:3000
      SCREENSHOT_BASE_URL: http://localhost:3000
      CI: "1"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: psa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Setup database with demo seed
        env:
          PGPASSWORD: postgres
          SEED_DEMO: "true"
        run: bash scripts/ci-setup-db.sh

      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/login >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - run: npm run screenshots

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-screenshots
          path: |
            docs/images/dashboard.png
            docs/images/invoices.png
            docs/images/profitability.png
            docs/images/demo.gif
          retention-days: 90
